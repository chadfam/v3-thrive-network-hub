<?xml version="1.0" encoding="UTF-8"?>
<!-- United to Thrive — horizontal lockup: "thrive" wordmark with the organic
     hub-and-spoke mark connected to the top-right of the "e".
     The wordmark uses Montserrat with a system fallback; when this file is used
     outside the site (e.g. handed to a printer or another tool), outline the
     "thrive" text in a vector editor for pixel-exact rendering. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 44" role="img" aria-label="United to Thrive">
  <text x="4" y="39" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1.5" fill="#0F172A">thrive</text>
  <g stroke="#0F172A" stroke-width="0.95" stroke-linecap="round">
    <line x1="120" y1="17" x2="139" y2="12"/>
    <line x1="139" y1="12" x2="132" y2="4"/>
    <line x1="139" y1="12" x2="153" y2="3"/>
    <line x1="139" y1="12" x2="165" y2="12"/>
    <line x1="139" y1="12" x2="161" y2="25"/>
    <line x1="139" y1="12" x2="143" y2="28"/>
  </g>
  <circle cx="132" cy="4" r="2.31" fill="#0F172A"/>
  <circle cx="153" cy="3" r="2.42" fill="#2563EB"/>
  <circle cx="165" cy="12" r="2.09" fill="#0F172A"/>
  <circle cx="161" cy="25" r="2.31" fill="#2563EB"/>
  <circle cx="143" cy="28" r="2.2" fill="#0F172A"/>
