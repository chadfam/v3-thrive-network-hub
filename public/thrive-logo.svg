  <text x="4" y="39" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1.5" fill="#0F172A">thrive</text>
  <g stroke="#0F172A" stroke-width="2" stroke-linecap="round">
    <line x1="116" y1="19" x2="137" y2="11"/>
    <line x1="137" y1="11" x2="127" y2="4"/>
    <line x1="137" y1="11" x2="149" y2="4"/>
    <line x1="137" y1="11" x2="163" y2="11"/>
    <line x1="137" y1="11" x2="159" y2="24"/>
    <line x1="137" y1="11" x2="140" y2="27"/>
  </g>
  <circle cx="127" cy="4" r="2.84" fill="#0F172A"/>
  <circle cx="149" cy="4" r="2.97" fill="#2563EB"/>
  <circle cx="163" cy="11" r="2.57" fill="#0F172A"/>
  <circle cx="159" cy="24" r="2.84" fill="#2563EB"/>
