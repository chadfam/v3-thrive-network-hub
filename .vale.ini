# Vale config for United to Thrive.
# See .vale/styles/UTT/ for the rule files.
# To use: brew install vale, then install the Vale VS Code extension.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Vale 3 natively parses Markdown, HTML, CSS, and a handful of other formats.
# It does NOT natively parse JSX/TSX text content. Source-code files (.tsx,
# .jsx, .ts, .js) are linted by the Claude Code Stop hook in
# .claude/scripts/utt-audit.sh instead. Also runnable on demand via
# `npm run lint:copy` which pipes each file through Vale as HTML.

[*.{md,html,css}]
BasedOnStyles = UTT
